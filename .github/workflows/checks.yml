name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Checker tests
        run: python3 test_verify.py
      - name: Generated classes match the protos
        run: ./gen-stubs.sh && git diff --exit-code
      - name: Topology compiles
        run: mvn -q -B compile
